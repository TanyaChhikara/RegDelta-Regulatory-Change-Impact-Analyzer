[project]
name = "regdelta"
version = "0.1.0"
description = "Regulatory Change Impact Analyzer — A multi-agent RAG system for Indian financial compliance"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

# Dependencies are added incrementally as we need them.
# Phase 0: Core utilities only. No frameworks until justified.
dependencies = [
    # HTTP + parsing (for RBI data fetching)
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "feedparser>=6.0.0",  # lenient RSS/Atom parsing (handles RBI feed's BOM, encoding quirks)
    "tiktoken>=0.5.0",  # real token counting matching OpenAI embedding models' tokenizer
    "openai>=1.0.0",  # embeddings API client

    # Data handling
    "pandas>=2.1.0",

    # Environment management
    "python-dotenv>=1.0.0",

    # Notebooks (for EDA)
    "jupyter>=1.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
